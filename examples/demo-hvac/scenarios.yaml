  # ---------- Price questions (5): only the $89 diagnostic, no transfer ----------
  - id: Q01
    title: How much is a new AC?
    emergency: false
    caller: {name: Ray Delgado, phone: "702-555-4410", address: "1001 Horizon Ridge Pkwy, Henderson"}
    situation: >
      Your AC is 15 years old and you're thinking about replacing it. You want
      to know how much a new one costs, installed. Push for a number.
    play: [interrupt]
    expect: {call_type: quote, action: no_transfer, must_say: ["coordinator|depends"]}
    listen_for: [Horizon Ridge, Henderson]

  - id: Q02
    title: Is the diagnostic free?
    emergency: false
    caller: {name: Janet Cole, phone: "702-555-0116", address: "830 Coral Sands Ave, Las Vegas"}
