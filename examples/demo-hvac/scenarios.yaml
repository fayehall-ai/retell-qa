      You want someone to check your AC before next summer. Nothing is broken.
      Any weekday works for you.
    play: [mumble]
    expect: {call_type: booking, action: no_transfer, must_say: ["text"]}
    listen_for: [Sahara]

  - id: B02
    title: Install estimate
    emergency: false
    caller: {name: Howard Pike, phone: "702-555-0108", address: "9902 Granite Crest Rd, Summerlin"}
    situation: >
      Your AC and furnace are 20 years old. You want someone to come out and
      tell you what a whole new system would involve and cost.
    play: [car]
    expect: {call_type: booking, action: no_transfer}
    listen_for: [Summerlin, Granite Crest]

  - id: B03
