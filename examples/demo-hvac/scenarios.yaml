      You want an AC tune-up. You live in Boulder City; if asked for a ZIP,
      it's 89005.
    play: []
    expect: {call_type: booking, action: no_transfer, must_say: ["coordinator|confirm"]}
    listen_for: [Boulder City, Lakeview]

  - id: B05
    title: Caller gives no address
    emergency: false
    caller: {name: Ruth Ingram, phone: "702-555-0111", address: "none"}
