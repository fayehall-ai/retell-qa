# Demo Heating & Air: the 30 test calls.
# Answer keys follow the starter agent prompt. Review every `expect` before
# testing: you approve what counts as correct, not the tool.
#
# Tester-facing (printed on the card): caller, situation, play.
#   Name, phone ending and street must be unique: that's how calls are matched.
#   "none" means the caller doesn't give it (printed as such on the card).
# Owner-only (never printed): id, title, emergency, expect, listen_for.
#
# call_type values must match your Retell post-call field:
#   emergency | booking | quote | existing_appointment | other

scenarios:
  # ---------- Emergencies (6): transfer to the on-call phone ----------
  - id: E01
    title: Gas smell
    emergency: true
    caller: {name: Maria Lopez, phone: "702-555-1234", address: "1420 Desert Rose Ln, Henderson"}
    situation: >
      You just walked into your kitchen and it smells strongly of gas, like
      rotten eggs. You're scared and not sure if you should stay inside.
    play: [fast, interrupt]
    expect:
      call_type: emergency
      action: transfer_to_owner
      must_say:
        - "leave (the|your) (house|home)"
        - "southwest gas|911|nine one one"
    listen_for: [Henderson, Desert Rose]

  - id: E02
    title: Heat out, elderly parent at home
    emergency: true
    caller: {name: Dan Okafor, phone: "702-555-0102", address: "88 Red Spring Dr, Summerlin"}
    situation: >
      Your furnace stopped working last night. It's about 35 degrees outside,
      your 84-year-old mother lives with you, and the house keeps getting colder.
    play: [pieces]
    expect: {call_type: emergency, action: transfer_to_owner}
    listen_for: [Summerlin, Red Spring]

  - id: E03
    title: AC out in the heat
    emergency: true
    caller: {name: Lena Brooks, phone: "702-555-0101", address: "2215 Cactus Wren Dr, Henderson"}
    situation: >
      Your AC stopped blowing cold air this afternoon. It's 104 outside and
      already 90 inside, and you have a two-year-old at home.
    play: [car]
    expect: {call_type: emergency, action: transfer_to_owner}
    listen_for: [Henderson, Cactus Wren]

  - id: E04
    title: Water pouring from the unit
    emergency: true
    caller: {name: Tom Reyes, phone: "702-555-0103", address: "7420 Silver Mesa Way, North Las Vegas"}
    situation: >
      Water is pouring out of the indoor unit in your hallway closet and
      spreading across the floor. You've put towels down but it keeps coming.
    play: [fast]
    expect: {call_type: emergency, action: transfer_to_owner}
    listen_for: [North Las Vegas, Silver Mesa]

  - id: E05
    title: Burning smell
    emergency: true
    caller: {name: Grace Whitfield, phone: "702-555-0104", address: "3310 Tumbleweed Ave, Spring Valley"}
    situation: >
      Every time the furnace kicks on, a burning plastic smell comes out of the
      vents. You turned the thermostat off and you're worried.
    play: [mumble]
    expect: {call_type: emergency, action: transfer_to_owner}
    listen_for: [Spring Valley, Tumbleweed]

  - id: E06
    title: Panicking caller, unit sparking
    emergency: true
    caller: {name: Kevin Marsh, phone: "702-555-0106", address: "615 Juniper Bluff Ct, Enterprise"}
    situation: >
      The outside AC unit is sparking and making a loud buzzing noise. You're
      panicking: talk fast, jump between details, and repeat yourself.
    play: [fast, interrupt, pieces]
    expect: {call_type: emergency, action: transfer_to_owner}
    listen_for: [Enterprise, Juniper Bluff]

  # ---------- Bookings (8): take the request, no transfer ----------
  - id: B01
    title: Tune-up
    emergency: false
    caller: {name: Kim Tran, phone: "702-555-0107", address: "5530 W Sahara Ave, Las Vegas"}
