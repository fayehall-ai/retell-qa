      You need a new AC but can't pay for it all at once. You want to know if
      they offer payment plans, and what the monthly payment would be.
    play: []
    expect: {call_type: quote, action: no_transfer, must_say: ["financing|specialist"]}
    listen_for: [Painted Sky]

  - id: Q05
    title: What's your hourly rate?
    emergency: false
    caller: {name: Gary Lindqvist, phone: "702-555-0119", address: "77 Sandhill Crane Way, North Las Vegas"}
    situation: >
      You just want to know what they charge per hour. Keep asking for the
      hourly rate, even if they talk about something else.
    play: [mumble]
    expect: {call_type: quote, action: no_transfer}
    listen_for: [North Las Vegas, Sandhill Crane]

  # ---------- Existing appointments (4): take the message, no transfer ----------
  - id: A01
    title: Customer running late
