# Agent-specific settings. Copy this file into your QA folder and edit it
# to match your Retell agent.

# Printed on the tester instructions.
business_name: "Demo Heating & Air"

# The number testers call: your agent's Retell phone line.
# NOT the owner's cell below. Keep the two distinct.
demo_number: "(555) 555-0100"

# Your Retell agent ID. score_new_calls only picks up calls to this agent.
# Leave empty to consider every phone call on the account (including real
# customers).
agent_id: ""

# Retell post-call analysis field that holds the call type
# (call.call_analysis.custom_analysis_data[<this>]). Its values must be:
# emergency | booking | quote | existing_appointment | other
call_type_field: call_type

# Map scenario actions to the tool calls that prove them.
# `tool` is the tool name in your Retell agent; `args` are substrings that
# must appear in the tool call's arguments (e.g. the transfer number).
actions:
  transfer_to_owner:
    tool: transfer_to_oncall
    args: ["+15555550199"]   # owner's cell, the transfer target
  no_transfer:
    tool: null               # no tool call except ending the call

# Forbidden statements in AGENT speech. Any hit marks the call forbidden=y
# and quotes the line, so you confirm it in the transcript.
forbidden:
  price:
    - '\$\s?\d'
    - '\bdollars?\b'
    - '\b\d+\s?bucks\b'
    - '\bper hour\b.*\b\d'
  arrival_time:
    - '\b(be|get) (there|to you|out) (in|by|at|around|within)\b'
    - '\b(arrive|arriving|arrival|show up)\b.*\b(\d|morning|afternoon|noon|minutes?|hours?|soon|shortly)\b'
    - '\bwithin (an|\d+|one|two|thirty|fifteen) (hour|minute)s?\b'
    - '\b(on (his|her|their) way|en route)\b'
  diagnosis:
    - '\b(sounds like|probably|likely|must be|it.s (your|the)) [^.,;!?]*(compressor|capacitor|thermostat|heat exchanger|igniter|pilot|clog|breaker|fuse|drain|coil|refrigerant|freon)\b'
    - '\b(try|you (can|could|should)) (resetting|reset|turning|flipping|replacing|checking)\b'

# Phrases the agent IS allowed to say, removed before the forbidden checks.
# Example: a fixed diagnostic fee and a callback promise from the prompt.
allowed_phrases:
  - "$89"
  - "89 dollars"
  - "eighty-nine dollars"
  - "eighty nine dollars"
  - "call you back within 15 minutes"
  - "call you back within fifteen minutes"

# Timing thresholds
thresholds:
  slow_e2e_p50_ms: 1000      # "feels under about one second"
  slow_e2e_max_ms: 2500      # any single turn this slow also counts as felt-slow
  cut_in_min_overlap_s: 0.25 # agent starts while caller keeps talking this long
  no_yield_overlap_s: 1.0    # caller barges in, agent keeps talking this long
  transfer_ring_max_s: 25
