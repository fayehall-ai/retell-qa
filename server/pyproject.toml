[project]
name = "retell-qa"
version = "0.1.0"
description = "MCP server that tests a Retell voice agent with real phone calls against a fixed pass bar."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=2.3,<3",
    "pyyaml>=6",
    "reportlab>=4",
]

[project.scripts]
retell-qa = "retell_qa.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retell_qa"]
